<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodej náhradních dílů</title>
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <!-- left side - hamburger -->
            <div class="true-navbar">
                <div class="menu" onclick="toggleDropdown()">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>

            <!-- dropdowns -->
            <div class="dropdown" id="dropdown">
                <a href="#">Exteriér</a>
                <a href="#" onclick="toggleNested(event)">Interiér</a>
                <a href="#">Motory</a>
                <a href="#">Převodovky</a>
                <a href="#">Kola</a>
            </div>
            <div class="dropdown2" id="dropdown2">
                <a href="#">Sedačky</a>
                <a href="#">Stropnice</a>
                <a href="#">Volant</a>
                <a href="#">Řadička</a>
                <a href="#">Držák na pití</a>
            </div>

            <!-- center - logo -->
            <div class="logo">
                <img src="src/RP.jpg" alt="Logo RP">
            </div>

            <!-- right side - icons -->
            <div class="nav-menu">
                <div class="icony">
                    <div class="icona">
                        <i class="fa-solid fa-money-bill"></i>
                    </div>
                    <div class="icona">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </div>
                    <div class="icona">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <script src="index.js"></script>
</body>
</html>
